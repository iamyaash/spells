baseURL: https://spells.yaasharc.me/
languageCode: en-us
title: Spells 🪄
theme: ["PaperModPlus"]

params:
  defaultTheme: auto # to switch between dark or light according to browser theme
  ShowCodeCopyButtons: true
  homeInfoParams:
    Title: Yaash's Grimoire
    Content: A spellbook of scripts, tools, and tech incantations. This is my **_personal grimoire_**, where I store runnable code snippets, document tool usage and write down useful knowledge for future usage.
  socialIcons: # optional
    - name: "RSS"
      url: "https://spells.yaasharc.me/"

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  en:
    languageName: "English"
    weight: 1
    menu:
      main:
        - name: 🔍 Search
          url: search/
          weight: 1
        - name: 🏷️ Tags
          url: tags/
          weight: 2
        - name: Archive
          url: archives/